services:
  db:
    image: postgres:16-alpine
    container_name: gamevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamevault
      POSTGRES_USER: gamevault
      POSTGRES_PASSWORD: gamevault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: